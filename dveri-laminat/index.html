<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Двери и ламинат</title>
    <meta
      name="description"
      content="Межкомнатные и входные двери, ламинат 32–34 класса. Каталог с ценами, подбор двери к полу, расчёт ламината и заявка в WhatsApp."
    />
    <meta name="theme-color" content="#16110d" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Двери и ламинат" />
    <meta
      property="og:description"
      content="Каталог дверей и ламината с ценами. Подберите дверь к полу и отправьте заявку в WhatsApp."
    />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;600&family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/scene.css" />
    <script>
      try {
        var t = localStorage.getItem("theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch {}
    </script>
  </head>
  <body>
    <div class="ambient" aria-hidden="true"></div>
    <header class="site-header" id="header"></header>
    <div id="notice"></div>
    <main id="app" tabindex="-1"></main>
    <footer class="site-footer" id="footer"></footer>
    <nav class="mbar glass veil" id="mbar" aria-label="Быстрые действия"></nav>
    <div id="layer"></div>
    <noscript>
      <p style="padding: 24px; text-align: center">
        Чтобы открыть каталог, включите JavaScript в настройках браузера.
      </p>
    </noscript>
    <script src="js/data.js"></script>
    <script src="js/textures.js"></script>
    <script src="js/render.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
